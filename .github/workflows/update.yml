name: Update merged calendar

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate merged.ics
        run: python3 merge.py

      - name: Commit and push if changed
        run: |
          git config user.name "sports-calendar-bot"
          git config user.email "sports-calendar-bot@users.noreply.github.com"
          git add docs/merged.ics
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh merged sports calendar"
            git push
          fi
